name: "🎬 Share an AI Battle Showcase"
description: "Share interesting battle results, model debates, or surprising security exploits discovered by DualAI MID Arena."
title: "🎬 [Showcase]: "
labels: ["showcase", "battle-logs"]
body:
  - type: markdown
    attributes:
      value: |
        ## 🎬 DualAI MID Arena — Battle Showcase
        Share a fascinating battle run where rival models discovered a subtle exploit, debated a security patch, or achieved multi-model consensus!

  - type: input
    id: project_name
    attributes:
      label: "Project / Target Application Name"
      placeholder: "e.g. My Next.js E-Commerce Backend / Stripe Webhook Handler"
    validations:
      required: true

  - type: checkboxes
    id: models_used
    attributes:
      label: "AI Models Engaged in the Arena"
      options:
        - label: "Ollama Local (llama3.2 / qwen2.5-coder / deepseek-r1)"
        - label: "OpenAI (gpt-4o / o1 / gpt-4o-mini)"
        - label: "Google Gemini (gemini-1.5-pro / gemini-2.0-flash)"
        - label: "Local OpenAI-Compatible Server (LM Studio / vLLM)"

  - type: dropdown
    id: handoff_rounds
    attributes:
      label: "Number of Handoff Rounds Completed"
      options:
        - "1–2 Rounds (Free Trial Level)"
        - "3–5 Rounds"
        - "6–10 Rounds"
        - "10+ Autonomous Gladiator Rounds"
    validations:
      required: true

  - type: textarea
    id: red_findings
    attributes:
      label: "🔴 Red Team Finding & Exploit Proof"
      description: "Paste the vulnerability discovered by Red Team."
      placeholder: |
        ```markdown
        ### Flaw Discovered: Insecure Deserialization in Session Store
        Line 42 of auth.js allows remote arbitrary payload injection...
        ```
    validations:
      required: true

  - type: textarea
    id: blue_remediation
    attributes:
      label: "🔵 Blue Team Remediation & Patch"
      description: "Paste the verified patch generated by Blue Team."
      placeholder: |
        ```javascript
        // Blue Team Patch Diff:
        - const session = eval(rawCookie);
        + const session = secureJsonParse(rawCookie, allowedSchema);
        ```
    validations:
      required: true

  - type: textarea
    id: consensus_transcript
    attributes:
      label: "⚖️ Multi-Model Consensus / Commentator Highlights"
      description: "Any notable quotes from the live radio commentator or model debate."
      placeholder: "Commentator: 'Red Team has the opening possession and immediately lands a blow on the session parser...'"
    validations:
      required: false
